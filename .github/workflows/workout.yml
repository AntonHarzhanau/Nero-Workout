name: Workout CI

on:
    push:
        branches:
            - "**"
        paths:
            - "services/workout-service/**"
            - ".github/workflows/workout.yml"
permissions:
    contents: read

jobs:
    test:
        name: Workout unit tests
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: services/workout-service

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: services/workout-service/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm test