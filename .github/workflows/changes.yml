name: Detect changes

on:
  workflow_call:
    outputs:
      services:
        description: JSON array of changed services
        value: ${{ jobs.detect.outputs.services }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-24.04

    outputs:
      services: ${{ github.ref_type == 'tag' && '["front", "workout", "account", "statistics", "init-secrets", "postgres"]' || steps.filter.outputs.changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Detect changed services
        if: github.ref_type != 'tag'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            front:
                - 'front/**'
                - '.github/workflows/**'

            workout:
                - 'services/workout-service/**'
                - '.github/workflows/**'

            account:
                - 'services/account-service/**'
                - '.github/workflows/**'

            statistics:
                - 'services/statistics-service/**'
                - '.github/workflows/**'

            init-secrets:
                - 'infra/secrets/**'
                - '.github/workflows/**'

            postgres:
                - 'infra/postgres/**'
                - '.github/workflows/**'
