name: Docker image

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string

      image-name:
        required: true
        type: string

      target:
        description: Docker build stage; empty selects the final stage
        required: false
        type: string
        default: runtime

      publish:
        description: Publish the image to GHCR
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare cache settings
        id: cache
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ inputs.image-name }}
          CACHE_SCOPE: ${{ inputs.image-name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            cache="type=registry,ref=${IMAGE_NAME,,}:buildcache"
          else
            cache="type=gha,scope=$CACHE_SCOPE"
          fi
          echo "from=$cache" >> "$GITHUB_OUTPUT"
          echo "to=$cache,mode=max" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.image-name }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,enable=${{ github.ref_type != 'tag' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.description=Nero ${{ inputs.image-name }} service

      - name: Login to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          push: ${{ inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
