name: Docker image

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string

      image-name:
        required: true
        type: string

      target:
        description: Docker build stage; empty selects the final stage
        required: false
        type: string
        default: runtime

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image name
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}-${{ inputs.image-name }}
        run: |
          echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.description=Nero ${{ inputs.image-name }} service

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        if: github.ref_type != 'tag'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

      - name: Tag published image
        if: github.ref_type == 'tag'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          TARGET_IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker buildx imagetools create \
            --tag "$TARGET_IMAGE" \
            "$IMAGE_NAME:sha-$(git rev-parse HEAD)"
