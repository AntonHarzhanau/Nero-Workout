name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  front:
    name: Frontend
    uses: ./.github/workflows/node-tests.yml
    with:
      working-directory: front

  workout:
    name: Workout
    uses: ./.github/workflows/node-tests.yml
    with:
      working-directory: services/workout-service

  account:
    name: Account
    uses: ./.github/workflows/php-tests.yml
    with:
      working-directory: services/account-service

  statistics:
    name: Statistics
    uses: ./.github/workflows/python-tests.yml
    with:
      working-directory: services/statistics-service

  images:
    name: Docker / ${{ matrix.service }}
    needs: [front, workout, account, statistics]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        service: [front, workout, account, statistics, init-secrets, postgres]

    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ matrix.service }}
      context: >-
        ${{ matrix.service == 'front' && 'front' ||
            matrix.service == 'init-secrets' && 'infra/secrets' ||
            matrix.service == 'postgres' && 'infra/postgres' ||
            format('services/{0}-service', matrix.service) }}
      target: ${{ matrix.service != 'init-secrets' && matrix.service != 'postgres' && 'runtime' || '' }}

  deploy:
    name: Deploy production
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/tags/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Redeploy Dockhand stack
        env:
          DEPLOY_URL: ${{ secrets.DOCKHAND_DEPLOY_URL }}
          API_TOKEN: ${{ secrets.DOCKHAND_API_TOKEN }}
        run: |
          : "${DEPLOY_URL:?Set the DOCKHAND_DEPLOY_URL repository secret}"
          : "${API_TOKEN:?Set the DOCKHAND_API_TOKEN repository secret}"

          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 540 \
            --request POST "$DEPLOY_URL" \
            --header "Authorization: Bearer $API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"pull":true,"build":false,"forceRecreate":true}'

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [front, workout, account, statistics, images, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .front.result == "success" and
            .workout.result == "success" and
            .account.result == "success" and
            .statistics.result == "success" and
            all(.[]; .result == "success" or .result == "skipped")
          '
