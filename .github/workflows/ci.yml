name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  front:
    name: Frontend
    uses: ./.github/workflows/node-tests.yml
    with:
      working-directory: front

  workout:
    name: Workout
    uses: ./.github/workflows/node-tests.yml
    with:
      working-directory: services/workout-service

  account:
    name: Account
    uses: ./.github/workflows/php-tests.yml
    with:
      working-directory: services/account-service

  statistics:
    name: Statistics
    uses: ./.github/workflows/python-tests.yml
    with:
      working-directory: services/statistics-service

  images:
    name: Docker / ${{ matrix.service }}
    needs: [changes, front, workout, account, statistics]

    if: >-
      ${{
        !cancelled() &&
        needs.changes.result == 'success' &&
        needs.front.result == 'success' &&
        needs.workout.result == 'success' &&
        needs.account.result == 'success' &&
        needs.statistics.result == 'success' &&
        needs.changes.outputs.services != '[]'
      }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    uses: ./.github/workflows/docker-image.yml
    with:
      image-name: ${{ matrix.service }}
      context: >-
        ${{ matrix.service == 'front' && 'front' ||
            matrix.service == 'init-secrets' && 'infra/secrets' ||
            matrix.service == 'postgres' && 'infra/postgres' ||
            format('services/{0}-service', matrix.service) }}
      target: ${{ matrix.service != 'init-secrets' && matrix.service != 'postgres' && 'runtime' || '' }}
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

  result:
    name: CI Result
    if: ${{ !cancelled() }}
    needs: [changes, front, workout, account, statistics, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            .front.result == "success" and
            .workout.result == "success" and
            .account.result == "success" and
            .statistics.result == "success" and
            all(.[]; .result == "success" or .result == "skipped")
          '
