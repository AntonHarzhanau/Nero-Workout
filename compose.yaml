services:
  postgres:
    image: postgres:17

    restart: "unless-stopped"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      ACCOUNT_DB_USER: ${ACCOUNT_DB_USER:?ACCOUNT_DB_USER is required}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}

      WORKOUT_DB_USER: ${WORKOUT_DB_USER:?WORKOUT_DB_USER is required}
      WORKOUT_DB_PASSWORD: ${WORKOUT_DB_PASSWORD:?WORKOUT_DB_PASSWORD is required}

      STATISTICS_DB_USER: ${STATISTICS_DB_USER:?STATISTICS_DB_USER is required}
      STATISTICS_DB_PASSWORD: ${STATISTICS_DB_PASSWORD:?STATISTICS_DB_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    networks:
      - database

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  init-secrets:
    build:
      context: ./infra/secrets

    restart: "no"
    network_mode: none

    volumes:
      - jwt_private:/generated/private
      - jwt_public:/generated/public
      - internal_token:/generated/internal

  account-migration:
    build:
      context: ./services/account-service
      target: runtime

    environment:
      DATABASE_URL: "postgresql://${ACCOUNT_DB_USER:?ACCOUNT_DB_USER is required}:${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?serverVersion=17&charset=utf8"
      APP_SECRET: ${ACCOUNT_APP_SECRET:?ACCOUNT_APP_SECRET is required}
      DEFAULT_URI: http://account-service:8080

    command:
      - php
      - bin/console
      - doctrine:migrations:migrate
      - --no-interaction

    restart: "no"

    networks:
      - database

    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: ./services/account-service
      target: runtime

    restart: "unless-stopped"

    environment:
      DATABASE_URL: "postgresql://${ACCOUNT_DB_USER:?ACCOUNT_DB_USER is required}:${ACCOUNT_DB_PASSWORD:?ACCOUNT_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?serverVersion=17&charset=utf8"
      APP_SECRET: ${ACCOUNT_APP_SECRET:?ACCOUNT_APP_SECRET is required}
      DEFAULT_URI: http://account-service:8080

      JWT_SECRET_KEY: /run/nero/private/jwt_private.pem
      JWT_PUBLIC_KEY: /run/nero/public/jwt_public.pem
      JWT_PASSPHRASE: ""

      INTERNAL_API_TOKEN_FILE: /run/nero/internal/internal_api_token
      WORKOUT_SERVICE_URL: http://workout-service:3001

    volumes:
      - jwt_private:/run/nero/private:ro
      - jwt_public:/run/nero/public:ro
      - internal_token:/run/nero/internal:ro

    networks:
      - backend
      - database

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(@file_get_contents("http://127.0.0.1:8080/health") === false ? 1 : 0);'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      postgres:
        condition: service_healthy
      init-secrets:
        condition: service_completed_successfully
      account-migration:
        condition: service_completed_successfully

  workout-migration:
    build:
      context: ./services/workout-service
      target: runtime

    restart: "no"

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${WORKOUT_DB_USER:?WORKOUT_DB_USER is required}
      DB_PASSWORD: ${WORKOUT_DB_PASSWORD:?WORKOUT_DB_PASSWORD is required}

    command:
      - node
      - node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/database/data-source.js

    networks:
      - database

    depends_on:
      postgres:
        condition: service_healthy

  workout-service:
    build:
      context: ./services/workout-service
      target: runtime

    restart: "unless-stopped"

    environment:
      NODE_ENV: production
      PORT: "3001"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
      DB_USER: ${WORKOUT_DB_USER:?WORKOUT_DB_USER is required}
      DB_PASSWORD: ${WORKOUT_DB_PASSWORD:?WORKOUT_DB_PASSWORD is required}

      INTERNAL_API_TOKEN_FILE: /run/nero/internal/internal_api_token
      JWT_PUBLIC_KEY: /run/nero/public/jwt_public.pem

    volumes:
      - jwt_public:/run/nero/public:ro
      - internal_token:/run/nero/internal:ro

    networks:
      - backend
      - database

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      postgres:
        condition: service_healthy
      init-secrets:
        condition: service_completed_successfully
      workout-migration:
        condition: service_completed_successfully

  front:
    build:
      context: ./front
      target: runtime

    restart: "unless-stopped"

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0

      ACCOUNT_API_URL: http://account-service:8080
      WORKOUT_API_URL: http://workout-service:3001

    ports:
      - "${FRONT_PORT:-3000}:3000"

    networks:
      - public
      - backend

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    depends_on:
      account-service:
        condition: service_healthy
      workout-service:
        condition: service_healthy

networks:
  public:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  database:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  jwt_private:
  jwt_public:
  internal_token:
